<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&display=swap");
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 480px; height: 48px; overflow: hidden; background: transparent; }
  .row {
    width: 480px; height: 48px; display: flex; gap: 10px; align-items: center;
    font-family: "IBM Plex Mono", ui-monospace, monospace; background: #070b12;
    padding: 6px 10px;
  }
  .p {
    font-size: 16px; padding: 6px 18px; border-radius: 999px;
    border: 1px solid #2a3a52; color: #9aa8bd;
  }
  .on { background: #1d9bf0; color: #071018; border-color: #1d9bf0; font-weight: 600; }
</style>
</head>
<body>
  <div class="row">
    <div class="p on" data-hero>EN</div>
    <div class="p">PL</div>
  </div>
</body>
</html>
